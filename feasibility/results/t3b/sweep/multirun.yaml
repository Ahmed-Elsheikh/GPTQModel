hydra:
  run:
    dir: ${oc.env:OB_OUT}/run/${name}
  sweep:
    dir: ${oc.env:OB_OUT}/sweep
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.job.env_set.OMP_NUM_THREADS=3
    - hydra.mode=MULTIRUN
    task:
    - backend.model=/home/user/GPTQModel/feasibility/models/synth-SmolLM2-135M,/home/user/GPTQModel/feasibility/models/synth-SmolLM2-360M
    - scenario.warmup_runs=0,10
    - scenario.input_shapes.batch_size=1,4
    - scenario.input_shapes.sequence_length=128,512
    - scenario.iterations=5
    - scenario.duration=0
    - +scenario.generate_kwargs.max_new_tokens=32
    - +scenario.generate_kwargs.min_new_tokens=32
  job:
    name: cli
    chdir: true
    override_dirname: +scenario.generate_kwargs.max_new_tokens=32,+scenario.generate_kwargs.min_new_tokens=32,backend.model=/home/user/GPTQModel/feasibility/models/synth-SmolLM2-135M,/home/user/GPTQModel/feasibility/models/synth-SmolLM2-360M,scenario.duration=0,scenario.input_shapes.batch_size=1,4,scenario.input_shapes.sequence_length=128,512,scenario.iterations=5,scenario.warmup_runs=0,10
    id: ???
    num: ???
    config_name: smollm_cpu
    env_set:
      OMP_NUM_THREADS: '3'
      OVERRIDE_BENCHMARKS: '1'
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/user/GPTQModel
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: optimum_benchmark
      schema: pkg
      provider: main
    - path: /home/user/GPTQModel/feasibility/ob_configs
      schema: file
      provider: command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      backend: pytorch
      launcher: process
      scenario: inference
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
name: smollm_cpu
backend:
  name: pytorch
  version: 2.14.1
  _target_: optimum_benchmark.backends.pytorch.backend.PyTorchBackend
  model: ${oc.env:OB_MODEL_ROOT}/synth-SmolLM2-135M
  processor: null
  task: text-generation
  library: null
  model_type: null
  device: cpu
  device_ids: null
  seed: 0
  inter_op_num_threads: null
  intra_op_num_threads: null
  model_kwargs: {}
  processor_kwargs: {}
  no_weights: false
  tp_plan: null
  device_map: null
  torch_dtype: float32
  eval_mode: true
  to_bettertransformer: false
  low_cpu_mem_usage: null
  attn_implementation: null
  cache_implementation: null
  allow_tf32: false
  autocast_enabled: false
  autocast_dtype: null
  torch_compile: false
  torch_compile_target: forward
  torch_compile_config: {}
  quantization_scheme: null
  quantization_config: {}
  deepspeed_inference: false
  deepspeed_inference_config: {}
  peft_type: null
  peft_config: {}
scenario:
  name: inference
  _target_: optimum_benchmark.scenarios.inference.scenario.InferenceScenario
  iterations: 5
  duration: 0
  warmup_runs: 10
  input_shapes:
    batch_size: 1
    sequence_length: 128
  new_tokens: null
  memory: true
  latency: true
  energy: false
  forward_kwargs: {}
  generate_kwargs:
    max_new_tokens: 32
    min_new_tokens: 32
  call_kwargs: {}
launcher:
  name: process
  _target_: optimum_benchmark.launchers.process.launcher.ProcessLauncher
  device_isolation: false
  device_isolation_action: null
  numactl: false
  numactl_kwargs: {}
  start_method: spawn
environment:
  cpu: ' Intel(R) Xeon(R) Processor @ 2.80GHz'
  cpu_count: 4
  cpu_ram_mb: 16876.515328
  system: Linux
  machine: x86_64
  platform: Linux-6.18.44-fc-v51-x86_64-with-glibc2.39
  processor: x86_64
  python_version: 3.11.15
  optimum_benchmark_version: 0.6.0
  optimum_benchmark_commit: null
  transformers_version: 4.57.6
  transformers_commit: null
  accelerate_version: 1.15.0
  accelerate_commit: null
  diffusers_version: null
  diffusers_commit: null
  optimum_version: null
  optimum_commit: null
  timm_version: null
  timm_commit: null
  peft_version: null
  peft_commit: null
print_report: false
log_report: true
