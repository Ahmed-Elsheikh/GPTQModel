task: synth_arc_easy
dataset_path: json
dataset_kwargs:
  data_files:
    train: feasibility/lm_eval_tasks/arc_train.jsonl
    test: feasibility/lm_eval_tasks/arc_test.jsonl
output_type: multiple_choice
training_split: train
test_split: test
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: "{{choices.label.index(answerKey)}}"
doc_to_choice: "{{choices.text}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
